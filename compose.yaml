name: shelter

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: shelter-app
    pull_policy: build      # образ збирається локально, у Docker Hub його не шукаємо
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    restart: unless-stopped
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  queue:
    image: shelter-app
    pull_policy: never      # використовує образ, зібраний для сервісу app
    env_file: .env
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2"]
    restart: unless-stopped
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      - app

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: shelter-web
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage/app:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shelter}
      POSTGRES_USER: ${DB_USERNAME:-shelter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shelter} -d ${DB_DATABASE:-shelter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Автотести: docker compose --profile tests run --rm tests
  tests:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: tests
    pull_policy: build
    profiles: ["tests"]
    env_file: .env
    environment:
      APP_ENV: testing
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
  storage:

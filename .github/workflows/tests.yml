name: Тести

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shelter_test
          POSTGRES_USER: shelter
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelter -d shelter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Отримати код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pgsql, gd, intl, zip, exif, bcmath
          coverage: pcov

      - name: Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Залежності PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Стиль коду (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Аудит залежностей
        run: |
          composer audit
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Збірка фронтенду
        run: npm run build

      - name: Середовище
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          php artisan key:generate

      # Покриття рядків коду застосунку (app/); поріг погоджено як навчальну ціль, перевіряється на кожному запуску
      - name: Автотести з покриттям
        run: ./vendor/bin/pest --coverage --min=85 --coverage-clover coverage.xml

      - name: Звіт про покриття
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

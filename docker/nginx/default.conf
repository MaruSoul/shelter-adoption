server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # Стиснення тексту: HTML, CSS, JS, JSON і SVG передаються в 3–5 разів меншими.
    # Фото (jpg, webp) вже стиснуті, тому їх не чіпаємо.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/ld+json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Файли збірки Vite мають хеш у назві, тож їх можна кешувати «назавжди»
    location ^~ /build/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|gif|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

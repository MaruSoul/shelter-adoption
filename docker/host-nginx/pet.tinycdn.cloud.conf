# Копія конфігурації nginx на самому сервері (поза Docker): /etc/nginx/sites-available/default.
# Тут лише для довідки – Docker цей файл не використовує. HTTPS: сертифікат Let's Encrypt від certbot.
# Після зміни на сервері: sudo nginx -t && sudo systemctl reload nginx
server {
    server_name pet.tinycdn.cloud;

    # Фото тварин завантажуються до 10 МБ; типове обмеження nginx – 1 МБ (відповідь 413)
    client_max_body_size 64M;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Справжня IP відвідувача для Laravel: обмеження анкет «5 на годину з однієї IP», журнали
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Контейнер web слухає лише 127.0.0.1:8080 (compose.yaml)
        proxy_pass http://127.0.0.1:8080;
    }

    http2 on;
    listen 443 quic;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pet.tinycdn.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pet.tinycdn.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
